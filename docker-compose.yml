# Certificat (et chaîne) et clé privée, en PEM, dans deux fichiers, partagés par les deux
# HAProxy. La clé doit être lisible par l'UID 99 (utilisateur de HAProxy dans le conteneur).
# create_host_path: false : un chemin qui n'existe pas fait échouer le démarrage, au lieu que
# Docker crée un dossier vide à sa place (HAProxy n'aurait alors aucun certificat).
x-tls-cert: &tls-cert
  type: bind
  source: ${TLS_CERT_PATH:?TLS_CERT_PATH doit désigner le certificat PEM, voir docs/HAPROXY.md}
  target: /usr/local/etc/haproxy/certs/site.pem
  read_only: true
  bind:
    create_host_path: false
x-tls-key: &tls-key
  type: bind
  source: ${TLS_KEY_PATH:?TLS_KEY_PATH doit désigner la clé privée PEM, voir docs/HAPROXY.md}
  target: /usr/local/etc/haproxy/certs/site.pem.key
  read_only: true
  bind:
    create_host_path: false

services:
  api:
    image: ${DOCKERHUB_USERNAME:-remi}/hypervisor-api:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hypervisor-api
    restart: unless-stopped
    # Accès depuis l'extérieur : uniquement en HTTPS, par api-haproxy. Ce port n'est ouvert que
    # sur la machine elle-même (Bruno, curl en local) ; supprimer ces deux lignes pour le fermer.
    ports:
      - "127.0.0.1:${API_LOCAL_PORT:-3000}:3000"
    environment:
      # Base PostgreSQL (service db) : comptes, droits, groupes, templates, propriétaires de VM,
      # audit. Le mot de passe est mis dans une URL : lettres et chiffres seulement.
      DATABASE_URL: postgres://${POSTGRES_USER:-hypervisor}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini (voir .env.example)}@db:5432/${POSTGRES_DB:-hypervisor}
      # Fichier de jetons noVNC, dans le volume partagé avec le conteneur noVNC (et lui seul).
      VM_CONFIG_PATH: /vnc/vm.cfg
      # URL de noVNC vue par le navigateur : l'adresse HTTPS de novnc-haproxy.
      NOVNC_URL: ${NOVNC_URL:-https://localhost:6443/vnc.html}
      SSH_PRIVATE_KEY_PATH: /run/secrets/ssh_private_key
      # Authentification. Le secret signe les JWT : 32 caractères minimum, à garder secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini (32 caractères minimum, voir .env.example)}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      VNC_TOKEN_TTL_SECONDS: ${VNC_TOKEN_TTL_SECONDS:-120}
      # Premier administrateur, créé seulement si la base ne contient encore aucun compte.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD doit être défini (8 caractères minimum, voir .env.example)}
      # Origines du front Angular autorisées à appeler l'API depuis un navigateur (CORS),
      # séparées par des virgules. Vide = même origine uniquement (front derrière un proxy).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      # Jetons noVNC (volume nommé, partagé avec le conteneur noVNC : il ne contient rien d'autre)
      - vnc-tokens:/vnc
      # Accès au socket libvirt de l'hôte (hyperviseurs locaux)
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      # Clé privée SSH pour la connexion aux hyperviseurs distants (qemu+ssh), et les clés
      # d'hôtes connues. create_host_path: false : un chemin qui n'existe pas fait échouer le
      # démarrage, au lieu que Docker crée un dossier vide à sa place (ssh l'ignorerait).
      - type: bind
        source: ${SSH_PRIVATE_KEY_HOST_PATH:-${HOME}/.ssh/id_ed25519}
        target: /run/secrets/ssh_private_key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SSH_PRIVATE_KEY_HOST_PATH:-${HOME}/.ssh/id_ed25519}
        target: /root/.ssh/id_ed25519
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${HOME}/.ssh/known_hosts
        target: /root/.ssh/known_hosts
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
    networks:
      - hypervisor-net
      # Seule l'API joint la base.
      - db-net

  # Base PostgreSQL de l'API. Aucun port publié, et sur un réseau à part : seule l'API la
  # joint. Les données sont dans le volume db-data (docker compose down ne l'efface pas).
  db:
    image: postgres:17-alpine
    container_name: hypervisor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hypervisor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini (voir .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:-hypervisor}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - db-net

  novnc:
    image: ${DOCKERHUB_USERNAME:-remi}/hypervisor-novnc:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.novnc
    container_name: hypervisor-novnc
    restart: unless-stopped
    # Pas de port publié : noVNC n'est joignable qu'à travers novnc-haproxy, en HTTPS.
    expose:
      - "6080"
    environment:
      VM_CONFIG_PATH: /vnc/vm.cfg
    volumes:
      # Jetons mis à jour par l'API (remplacement atomique du fichier) et lus par websockify.
      # On monte le volume entier et en lecture seule : noVNC ne voit ni la base ni les comptes.
      - vnc-tokens:/vnc:ro
    depends_on:
      - api
    networks:
      - hypervisor-net

  # Seule entrée de l'API (voir docs/HAPROXY.md) :
  #   - HTTPS publié (API_HTTPS_PORT) pour Swagger, Bruno, scripts ; HTTP redirigé vers HTTPS ;
  #   - HTTPS sur le port 9443, non publié, pour le nginx du front (réseau Docker seulement).
  api-haproxy:
    image: haproxy:3.0-alpine
    container_name: hypervisor-api-haproxy
    restart: unless-stopped
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/common.cfg", "-f", "/usr/local/etc/haproxy/api.cfg"]
    ports:
      - "${API_HTTP_PORT:-8081}:8080"
      - "${API_HTTPS_PORT:-8443}:8443"
    # Entrée du front (API_UPSTREAM=https://api-haproxy:9443) : joignable sur le réseau Docker,
    # jamais publiée sur la machine.
    expose:
      - "9443"
    environment:
      # Pour la redirection HTTP -> HTTPS.
      HTTPS_PORT: ${API_HTTPS_PORT:-8443}
    volumes:
      - ./haproxy/common.cfg:/usr/local/etc/haproxy/common.cfg:ro
      - ./haproxy/api.cfg:/usr/local/etc/haproxy/api.cfg:ro
      - *tls-cert
      - *tls-key
    depends_on:
      - api
    networks:
      - hypervisor-net

  # Entrée HTTPS des consoles : pages noVNC et WebSocket. C'est l'adresse de NOVNC_URL.
  novnc-haproxy:
    image: haproxy:3.0-alpine
    container_name: hypervisor-novnc-haproxy
    restart: unless-stopped
    command: ["haproxy", "-f", "/usr/local/etc/haproxy/common.cfg", "-f", "/usr/local/etc/haproxy/novnc.cfg"]
    ports:
      - "${NOVNC_HTTP_PORT:-6081}:8080"
      - "${NOVNC_HTTPS_PORT:-6443}:8443"
    environment:
      HTTPS_PORT: ${NOVNC_HTTPS_PORT:-6443}
    volumes:
      - ./haproxy/common.cfg:/usr/local/etc/haproxy/common.cfg:ro
      - ./haproxy/novnc.cfg:/usr/local/etc/haproxy/novnc.cfg:ro
      - *tls-cert
      - *tls-key
    depends_on:
      - novnc
    networks:
      - hypervisor-net

volumes:
  vnc-tokens:
  db-data:

networks:
  hypervisor-net:
    driver: bridge
  # Réseau de la base : interne, sans accès à l'extérieur.
  db-net:
    internal: true
