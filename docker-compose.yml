services:
  api:
    image: ${DOCKERHUB_USERNAME:-remi}/hypervisor-api:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hypervisor-api
    restart: unless-stopped
    # Accès depuis l'extérieur : uniquement en HTTPS, par haproxy. Ce port n'est ouvert que
    # sur la machine elle-même (Bruno, curl en local) ; supprimer ces deux lignes pour le fermer.
    ports:
      - "127.0.0.1:${API_LOCAL_PORT:-3000}:3000"
    environment:
      # Base SQLite : comptes, droits, propriétaires de VM, audit (volume ./data).
      DATABASE_URL: sqlite:///data/api.db?mode=rwc
      # Fichier de jetons noVNC, dans le volume partagé avec le conteneur noVNC (et lui seul).
      VM_CONFIG_PATH: /vnc/vm.cfg
      # URL de noVNC vue par le navigateur, derrière haproxy.
      NOVNC_URL: ${NOVNC_URL:-https://localhost/vnc.html}
      SSH_PRIVATE_KEY_PATH: /run/secrets/ssh_private_key
      # Authentification. Le secret signe les JWT : 32 caractères minimum, à garder secret.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET doit être défini (32 caractères minimum, voir .env.example)}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-604800}
      VNC_TOKEN_TTL_SECONDS: ${VNC_TOKEN_TTL_SECONDS:-120}
      # Premier administrateur, créé seulement si la base ne contient encore aucun compte.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD doit être défini (8 caractères minimum, voir .env.example)}
      # Origines du front Angular autorisées à appeler l'API depuis un navigateur (CORS),
      # séparées par des virgules. Vide = même origine uniquement (front derrière un proxy).
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      # Persistance de la base de données
      - ./data:/data
      # Jetons noVNC (volume nommé, partagé avec le conteneur noVNC : il ne contient rien d'autre)
      - vnc-tokens:/vnc
      # Accès au socket libvirt de l'hôte (hyperviseurs locaux)
      - /var/run/libvirt/libvirt-sock:/var/run/libvirt/libvirt-sock
      # Clé privée SSH pour la connexion aux hyperviseurs distants
      - ${SSH_PRIVATE_KEY_HOST_PATH:-~/.ssh/id_ed25519}:/run/secrets/ssh_private_key:ro
      - ${SSH_PRIVATE_KEY_HOST_PATH:-~/.ssh/id_ed25519}:/root/.ssh/id_ed25519:ro
      - $HOME/.ssh/known_hosts:/root/.ssh/known_hosts:ro
    networks:
      - hypervisor-net

  novnc:
    image: ${DOCKERHUB_USERNAME:-remi}/hypervisor-novnc:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.novnc
    container_name: hypervisor-novnc
    restart: unless-stopped
    # Pas de port publié : noVNC n'est joignable qu'à travers haproxy, en HTTPS.
    expose:
      - "6080"
    environment:
      VM_CONFIG_PATH: /vnc/vm.cfg
    volumes:
      # Jetons mis à jour par l'API (remplacement atomique du fichier) et lus par websockify.
      # On monte le volume entier et en lecture seule : noVNC ne voit ni la base ni les comptes.
      - vnc-tokens:/vnc:ro
    depends_on:
      - api
    networks:
      - hypervisor-net

  # Seule porte d'entrée : HTTPS pour l'API et noVNC, HTTP redirigé (voir docs/HAPROXY.md).
  haproxy:
    image: haproxy:3.0-alpine
    container_name: hypervisor-haproxy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      # Pour la redirection HTTP -> HTTPS.
      HTTPS_PORT: ${HTTPS_PORT:-443}
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      # Certificat (et chaîne) et clé privée, en PEM, dans deux fichiers. La clé doit être
      # lisible par l'UID 99 (utilisateur de HAProxy dans le conteneur).
      # create_host_path: false : un chemin qui n'existe pas fait échouer le démarrage, au
      # lieu que Docker crée un dossier vide à sa place (HAProxy n'aurait alors aucun certificat).
      - type: bind
        source: ${TLS_CERT_PATH:?TLS_CERT_PATH doit désigner le certificat PEM, voir docs/HAPROXY.md}
        target: /usr/local/etc/haproxy/certs/site.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${TLS_KEY_PATH:?TLS_KEY_PATH doit désigner la clé privée PEM, voir docs/HAPROXY.md}
        target: /usr/local/etc/haproxy/certs/site.pem.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - api
      - novnc
    networks:
      - hypervisor-net

volumes:
  vnc-tokens:

networks:
  hypervisor-net:
    driver: bridge
