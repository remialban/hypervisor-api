# Settings shared by the HAProxy of the API (api.cfg) and the one of noVNC (novnc.cfg).
# Each container loads this file first, then its own: haproxy -f common.cfg -f <its>.cfg
# (see docker-compose.yml and docs/HAPROXY.md).
#
# Each container listens on 8080 (HTTP, redirected) and 8443 (HTTPS): no privileged port is
# needed inside it. docker-compose.yml maps them to different ports on the host.

global
    log stdout format raw local0 info
    # TLS 1.2 and 1.3 only, with the "intermediate" cipher list of Mozilla.
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    # The private key is in its own file, next to the certificate: <certificate>.key.
    ssl-load-extra-files key

# Docker's DNS: HAProxy starts even if its backend is not up yet, and follows its restarts.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    # An open console (WebSocket) can stay idle for a long time.
    timeout tunnel 1h
    default-server init-addr last,libc,none resolvers docker

# HTTP: only redirects to HTTPS, on the public HTTPS port of this container (HTTPS_PORT).
frontend http
    bind :8080
    http-request redirect code 301 location "https://%[req.hdr(host),field(1,:)]:${HTTPS_PORT}%[capture.req.uri]"
