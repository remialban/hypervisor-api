# HTTPS entry point of the VM consoles (loaded after common.cfg): everything goes to
# novnc:6080, that is the noVNC pages (/vnc.html...) and the WebSocket (/websockify).
# The API gives the browser its address in novnc_url (NOVNC_URL).

frontend https
    # Certificate (and chain) in site.pem, private key in site.pem.key (docker-compose.yml).
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/site.pem alpn h2,http/1.1

    http-request set-header X-Forwarded-Proto https

    # The noVNC URL carries its token: never send it to another site in a Referer.
    http-response set-header Referrer-Policy no-referrer
    http-response set-header Strict-Transport-Security "max-age=31536000"
    http-response set-header X-Content-Type-Options nosniff

    default_backend novnc

backend novnc
    server novnc novnc:6080 check
