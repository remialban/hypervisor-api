# HTTPS entry point of the API (loaded after common.cfg): everything goes to api:3000.
# Swagger, Bruno, scripts... The web front reaches the API on its own, through the Docker
# network (nginx -> api:3000), not through this proxy.

frontend https
    # Certificate (and chain) in site.pem, private key in site.pem.key (docker-compose.yml).
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/site.pem alpn h2,http/1.1

    http-request set-header X-Forwarded-Proto https

    # Slows down password guessing: at most 20 authentication requests per 10 s per address.
    stick-table type ip size 100k expire 1m store http_req_rate(10s)
    acl is_auth path_beg /api/auth/
    http-request track-sc0 src if is_auth
    http-request deny deny_status 429 if is_auth { sc_http_req_rate(0) gt 20 }

    http-response set-header Strict-Transport-Security "max-age=31536000"
    http-response set-header X-Content-Type-Options nosniff

    default_backend api

backend api
    option httpchk GET /ping
    server api api:3000 check
