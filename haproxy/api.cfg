# Entry point of the API (loaded after common.cfg): everything goes to api:3000.
#
#   :8443  HTTPS, published on the host (API_HTTPS_PORT): Swagger, Bruno, scripts.
#   :8000  plain HTTP, NOT published: only for the web front's nginx, on the Docker network
#          (API_UPSTREAM=http://api-haproxy:8000 in hypervisor-ui). The traffic stays inside
#          the machine; TLS ends at the front's HAProxy.

frontend api
    # Certificate (and chain) in site.pem, private key in site.pem.key (docker-compose.yml).
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/site.pem alpn h2,http/1.1
    bind :8000

    # Behind the front, the client of this proxy is nginx: the browser's address is in
    # X-Forwarded-For, which nginx sets itself. Trusted on :8000 only, never on :8443 where
    # anyone could send that header.
    acl from_front dst_port 8000
    http-request set-src req.hdr_ip(x-forwarded-for,-1) if from_front { req.hdr_cnt(x-forwarded-for) gt 0 }

    http-request set-header X-Forwarded-Proto https

    # Slows down password guessing: at most 20 authentication requests per 10 s per browser
    # address, whether they come directly or through the front.
    stick-table type ip size 100k expire 1m store http_req_rate(10s)
    acl is_auth path_beg /api/auth/
    http-request track-sc0 src if is_auth
    http-request deny deny_status 429 if is_auth { sc_http_req_rate(0) gt 20 }

    http-response set-header Strict-Transport-Security "max-age=31536000" unless from_front
    http-response set-header X-Content-Type-Options nosniff

    default_backend api

backend api
    option httpchk GET /ping
    # Some libvirt operations (remote hypervisor over SSH) take time: as long as the front's nginx.
    timeout server 120s
    server api api:3000 check
