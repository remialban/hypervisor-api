# HTTPS entry point of the API and of noVNC (see docs/HAPROXY.md).
#
#   /api/..., /swagger-ui, /api-docs/..., /ping  -> api:3000
#   everything else (/vnc.html, /websockify...) -> novnc:6080
#
# The container listens on 8080 (HTTP, redirected) and 8443 (HTTPS): no privileged port is
# needed inside it. docker-compose.yml maps them to HTTP_PORT and HTTPS_PORT on the host.

global
    log stdout format raw local0 info
    # TLS 1.2 and 1.3 only, with the "intermediate" cipher list of Mozilla.
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    # The private key is in its own file, next to the certificate: <certificate>.key.
    ssl-load-extra-files key

# Docker's DNS: HAProxy starts even if a backend is not up yet, and follows its restarts.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 60s
    timeout server 60s
    timeout http-request 10s
    # An open console (WebSocket) can stay idle for a long time.
    timeout tunnel 1h
    default-server init-addr last,libc,none resolvers docker

frontend http
    bind :8080
    http-request redirect code 301 location "https://%[req.hdr(host),field(1,:)]:${HTTPS_PORT}%[capture.req.uri]"

frontend https
    # Certificate (and chain) in site.pem, private key in site.pem.key (docker-compose.yml).
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/site.pem alpn h2,http/1.1

    http-request set-header X-Forwarded-Proto https

    # Slows down password guessing: at most 20 authentication requests per 10 s per address.
    stick-table type ip size 100k expire 1m store http_req_rate(10s)
    acl is_auth path_beg /api/auth/
    http-request track-sc0 src if is_auth
    http-request deny deny_status 429 if is_auth { sc_http_req_rate(0) gt 20 }

    # The noVNC URL carries its token: never send it to another site in a Referer.
    http-response set-header Referrer-Policy no-referrer
    http-response set-header Strict-Transport-Security "max-age=31536000"
    http-response set-header X-Content-Type-Options nosniff

    # Two lines for one ACL: either one matches.
    acl is_api path /ping
    acl is_api path_beg /api/ /api-docs/ /swagger-ui
    use_backend api if is_api
    default_backend novnc

backend api
    option httpchk GET /ping
    server api api:3000 check

backend novnc
    server novnc novnc:6080 check
